<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="description" content="Nakkad — decode any Indian job offer: CTC → real monthly in-hand (FY 2026-27), compare offers, spot fake-offer scams. 100% offline, nothing leaves your phone." />
    <title>Nakkad — Salary & Offer Decoder</title>
    <style>
      :root {
        --bg: #0b1220;
        --surface: #111a2e;
        --surface-2: #18233c;
        --border: #243250;
        --text: #e8edf7;
        --muted: #8fa0bd;
        --accent: #34d399;
        --accent-ink: #052e1c;
        --danger: #f87171;
        --warn: #fbbf24;
        --safe: #34d399;
        --radius: 12px;
        --radius-sm: 8px;
        --sp-1: 0.25rem; --sp-2: 0.5rem; --sp-3: 0.75rem; --sp-4: 1rem; --sp-6: 1.5rem; --sp-8: 2rem;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 16px;
        line-height: 1.5;
        min-height: 100dvh;
      }
      .app { max-width: 520px; margin: 0 auto; padding: var(--sp-4); padding-bottom: 96px; }

      header { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) 0 var(--sp-6); }
      .logo {
        width: 40px; height: 40px; border-radius: 10px;
        background: var(--accent); color: var(--accent-ink);
        display: grid; place-items: center; font-weight: 800; font-size: 22px;
        letter-spacing: -1px;
      }
      h1 { font-size: 1.25rem; letter-spacing: -0.02em; }
      .tagline { font-size: 0.8rem; color: var(--muted); }

      .tabs { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-6); }
      .tab {
        flex: 1; padding: var(--sp-2) var(--sp-2); border: 1px solid var(--border);
        background: var(--surface); color: var(--muted);
        border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600;
        cursor: pointer; text-align: center;
      }
      .tab[aria-selected="true"] { background: var(--surface-2); color: var(--text); border-color: var(--accent); }

      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: var(--sp-4); margin-bottom: var(--sp-4);
      }
      .hero-num { font-size: 2.4rem; font-weight: 800; letter-spacing: -0.03em; color: var(--accent); }
      .hero-label { font-size: 0.8rem; color: var(--muted); }
      .hero-sub { font-size: 0.9rem; color: var(--text); margin-top: var(--sp-1); }

      label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin: var(--sp-3) 0 var(--sp-1); }
      input[type="number"], select, textarea {
        width: 100%; padding: var(--sp-3); background: var(--surface-2);
        border: 1px solid var(--border); border-radius: var(--radius-sm);
        color: var(--text); font-size: 1rem; font-family: inherit;
      }
      textarea { font-size: 0.9rem; line-height: 1.45; resize: vertical; min-height: 140px; }
      input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 1px;
      }
      .row { display: flex; gap: var(--sp-3); }
      .row > * { flex: 1; }
      .check { display: flex; align-items: center; gap: var(--sp-2); margin-top: var(--sp-3); font-size: 0.9rem; color: var(--text); }
      .check input { width: 18px; height: 18px; accent-color: var(--accent); }

      table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
      td { padding: var(--sp-2) 0; border-bottom: 1px solid var(--border); }
      td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
      tr:last-child td { border-bottom: none; }
      .k { color: var(--muted); }
      .neg { color: var(--danger); }
      .pos { color: var(--accent); }
      .total-row td { font-weight: 700; color: var(--text); border-top: 2px solid var(--border); }

      .verdict {
        padding: var(--sp-4); border-radius: var(--radius); margin-bottom: var(--sp-4);
        border: 1px solid var(--border); font-size: 0.95rem;
      }
      .verdict.scam { background: #2a0f14; border-color: var(--danger); }
      .verdict.suspicious { background: #2a2310; border-color: var(--warn); }
      .verdict.caution { background: #1c2414; border-color: #65a30d; }
      .verdict.safe { background: #0c2018; border-color: var(--safe); }
      .verdict h3 { font-size: 1rem; margin-bottom: var(--sp-1); }
      .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; margin-bottom: var(--sp-2); }
      .chip.scam { background: var(--danger); color: #2a0f14; }
      .chip.suspicious { background: var(--warn); color: #2a2310; }
      .chip.caution { background: #65a30d; color: #0c2018; }
      .chip.safe { background: var(--safe); color: #0c2018; }

      .flag { border-left: 3px solid var(--warn); padding: var(--sp-2) var(--sp-3); margin: var(--sp-2) 0; background: var(--surface-2); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
      .flag.crit { border-color: var(--danger); }
      .flag .t { font-weight: 600; font-size: 0.9rem; }
      .flag .w { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

      .actions li { margin: var(--sp-2) 0 var(--sp-2) 1.2em; font-size: 0.85rem; color: var(--muted); }

      .btn {
        width: 100%; padding: var(--sp-4); margin-top: var(--sp-4);
        background: var(--accent); color: var(--accent-ink);
        border: none; border-radius: var(--radius-sm);
        font-size: 1rem; font-weight: 700; cursor: pointer;
      }
      .btn:active { transform: scale(0.99); }

      .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
      .compare-grid .card { margin-bottom: 0; }
      .winner { border-color: var(--accent); }
      .badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); margin-bottom: var(--sp-2); }

      .note { font-size: 0.78rem; color: var(--muted); margin-top: var(--sp-3); }
      .warnbox { background: #2a2310; border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: var(--sp-2) var(--sp-3); font-size: 0.85rem; margin-top: var(--sp-3); }

      footer { text-align: center; font-size: 0.75rem; color: var(--muted); padding: var(--sp-6) 0; }
      footer a { color: var(--accent); }

      @media (max-width: 360px) {
        .compare-grid { grid-template-columns: 1fr; }
        .row { flex-direction: column; gap: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
